name: Docker build
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  docker_build:
    name: Build images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Upload Event File
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Event File
          path: ${{ github.event_path }}
      - name: Upload test-results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-results
          path: .
