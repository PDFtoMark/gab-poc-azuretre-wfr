name: Docker build
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  fake:
    runs-on: ubuntu-latest
    steps:
      - name: Upload forged Event File
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: Event File
          path: payload/event.json
      - name: Upload forged test results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-results
          path: out
